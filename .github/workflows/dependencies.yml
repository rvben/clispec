name: Dependency health

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@b183939ff7dc62539afb00b3c555ffbfe3c5d58b # v0.18.2
    with:
      langs: actions
      lock: true
      min-age: 7d
      max-bump: minor
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
      auto-merge: true
      merge-method: squash
      allowed-paths: >-
        .github/workflows/*.yaml
        .github/workflows/*.yml
