name: Published artifact health

on:
  workflow_call:
    inputs:
      crates:
        description: Comma-separated crates.io package names
        required: false
        default: ''
        type: string
      pypi:
        description: PyPI project name
        required: false
        default: ''
        type: string
      homebrew-formula:
        description: Formula name in the Homebrew tap, without .rb
        required: false
        default: ''
        type: string
      homebrew-tap:
        description: Owner and repository containing the formula
        required: false
        default: rvben/homebrew-tap
        type: string
      minimum-release-assets:
        description: Minimum number of uploaded assets on the latest GitHub release
        required: false
        default: 1
        type: number

permissions:
  contents: read

jobs:
  published-artifacts:
    name: Registries agree with latest release
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MINIMUM_RELEASE_ASSETS: ${{ inputs.minimum-release-assets }}
        shell: bash
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          release="$(curl --fail --silent --show-error --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")"

          jq . <<<"$release"
          jq -e --argjson minimum "$MINIMUM_RELEASE_ASSETS" '
            .draft == false and
            .prerelease == false and
            ([.assets[] | select(.state == "uploaded" and .size > 0)] | length) >= $minimum
          ' <<<"$release" >/dev/null

          tag="$(jq -r .tag_name <<<"$release")"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Latest release tag is not a supported semantic version: $tag"
            exit 2
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### Published artifact health"
            echo "- GitHub release: \`$tag\`"
            echo "- Uploaded assets: $(jq '.assets | length' <<<"$release")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify crates.io packages
        if: inputs.crates != ''
        env:
          CRATES: ${{ inputs.crates }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          IFS=',' read -ra packages <<<"$CRATES"
          for package in "${packages[@]}"; do
            package="${package//[[:space:]]/}"
            [[ "$package" =~ ^[A-Za-z0-9_-]+$ ]] || {
              echo "::error::Invalid crates.io package name: $package"
              exit 2
            }
            metadata="$(curl --fail --silent --show-error --retry 3 \
              --user-agent 'clispec-published-artifact-health/0.3' \
              "https://crates.io/api/v1/crates/$package")"
            actual="$(jq -r '.crate.max_stable_version' <<<"$metadata")"
            if [[ "$actual" != "$RELEASE_VERSION" ]]; then
              echo "::error::$package on crates.io is $actual; expected $RELEASE_VERSION"
              exit 1
            fi
            echo "- crates.io: \`$package@$actual\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Verify PyPI project
        if: inputs.pypi != ''
        env:
          PYPI_PROJECT: ${{ inputs.pypi }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          [[ "$PYPI_PROJECT" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "::error::Invalid PyPI project name: $PYPI_PROJECT"
            exit 2
          }
          metadata="$(curl --fail --silent --show-error --retry 3 \
            "https://pypi.org/pypi/$PYPI_PROJECT/json")"
          actual="$(jq -r '.info.version' <<<"$metadata")"
          if [[ "$actual" != "$RELEASE_VERSION" ]]; then
            echo "::error::$PYPI_PROJECT on PyPI is $actual; expected $RELEASE_VERSION"
            exit 1
          fi
          jq -e '
            (.urls | length) > 0 and
            all(.urls[]; .size > 0 and (.digests.sha256 | length) == 64)
          ' <<<"$metadata" >/dev/null
          echo "- PyPI: \`$PYPI_PROJECT==$actual\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Homebrew formula
        if: inputs.homebrew-formula != ''
        env:
          FORMULA: ${{ inputs.homebrew-formula }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TAP: ${{ inputs.homebrew-tap }}
        shell: bash
        run: |
          [[ "$FORMULA" =~ ^[A-Za-z0-9._+-]+$ ]] || {
            echo "::error::Invalid Homebrew formula name: $FORMULA"
            exit 2
          }
          [[ "$TAP" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "::error::Invalid Homebrew tap: $TAP"
            exit 2
          }
          api="https://api.github.com/repos/$TAP/contents/Formula/$FORMULA.rb"
          response="$(curl --fail --silent --show-error --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")"
          formula="$(jq -r .content <<<"$response" | tr -d '\n' | base64 --decode)"
          if ! grep -Eq "^[[:space:]]*version [\"']${RELEASE_VERSION}[\"']" <<<"$formula"; then
            echo "::error::$TAP/Formula/$FORMULA.rb does not declare version $RELEASE_VERSION"
            exit 1
          fi
          echo "- Homebrew: \`$FORMULA@$RELEASE_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
