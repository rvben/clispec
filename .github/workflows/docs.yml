name: CI

# No path filters. The spec, the schema, the fixture suite and the tooling are
# one artifact now: a change to tests/ can invalidate docs/, and a filter that
# skips the run is indistinguishable from a run that passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      # Each step is a make target and nothing else, so every failure here
      # reproduces with one command on a laptop.
      - name: No frozen schema has changed
        run: make checksums

      - name: Normative fixture suite
        run: make test

      - name: The fixture suite can still fail
        run: make mutate

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Build documentation
        run: make build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=clispec-dev
